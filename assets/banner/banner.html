<!doctype html>
<!--
  README 首图 / GitHub 社交预览图的模板，1280×640。
  数字从 URL 参数读：banner.html?entries=84&recipes=9&tutorials=123
  加 &mode=card 出不带数字的版本（给 GitHub Settings → Social preview 上传，数字变了也不用重传）。
  直接在浏览器打开可以调样式；出图用 scripts/banner.py。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #0f1115;
    color: #d6dae0;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    position: relative;
  }
  .bar { position: absolute; left: 0; top: 0; width: 16px; height: 640px; background: #ff7a1a; }
  .wrap { position: absolute; left: 88px; top: 84px; right: 88px; }
  .repo { font-size: 34px; color: #8b93a1; letter-spacing: 0.5px; }
  h1 { margin-top: 18px; font-size: 84px; font-weight: 600; color: #fff; line-height: 1.15; }
  .sub { margin-top: 26px; font-size: 38px; line-height: 1.45; }
  .stats { margin-top: 44px; display: flex; gap: 72px; align-items: baseline; }
  .stat b { font-size: 76px; font-weight: 600; color: #ff7a1a; font-variant-numeric: tabular-nums; }
  .stat span { margin-left: 12px; font-size: 34px; }
  .pills { margin-top: 52px; display: flex; gap: 20px; }
  .pills span { font-size: 34px; color: #ff7a1a; border: 2px solid #ff7a1a; border-radius: 40px; padding: 8px 28px; }
  .foot { position: absolute; left: 88px; bottom: 54px; font-size: 28px; color: #8b93a1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="wrap">
    <div class="repo">awesome-grokbot-playbooks</div>
    <h1>Grok Bot 中文配方库</h1>
    <div class="sub">作战室 · 雷达 Routine · 额度体检 · 一人公司<br>可抄的配方 + 逐条核实的清单，中英双语</div>
    <div class="stats" id="stats">
      <div class="stat"><b id="entries">–</b><span>条目</span></div>
      <div class="stat"><b id="recipes">–</b><span>配方</span></div>
      <div class="stat"><b id="tutorials">–</b><span>篇教程</span></div>
    </div>
    <div class="pills" id="pills" hidden>
      <span>可抄配方</span><span>逐条核实</span><span>教程精选</span>
    </div>
  </div>
  <div class="foot">Grok Bot 找料 · Claude 核实 · 人拍板 — 协作过程全公开</div>
<script>
  const q = new URLSearchParams(location.search);
  for (const k of ['entries', 'recipes', 'tutorials']) {
    if (q.has(k)) document.getElementById(k).textContent = q.get(k);
  }
  if (q.get('mode') === 'card') {
    document.getElementById('stats').hidden = true;
    document.getElementById('pills').hidden = false;
  }
</script>
</body>
</html>
